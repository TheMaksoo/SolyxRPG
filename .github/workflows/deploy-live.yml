name: Deploy to Live

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm live deployment'
        required: true
        type: string

jobs:
  deploy:
    name: Deploy to play.solyx.gg
    runs-on: ubuntu-latest
    environment: production
    permissions: {}

    steps:
      - name: Confirm deployment
        if: ${{ github.event.inputs.confirm != 'deploy' }}
        run: |
          echo "Deployment cancelled. You must type 'deploy' to confirm."
          exit 1

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_SSH_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.PROD_APP_PATH }}

            echo "==> Pulling latest main branch"
            git pull origin main

            echo "==> Installing Composer dependencies"
            composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev

            echo "==> Installing npm dependencies and building assets"
            npm ci
            npm run build

            echo "==> Putting app into maintenance mode"
            php artisan down --retry=10 || true

            echo "==> Running migrations"
            php artisan migrate --force

            echo "==> Running changelog seeder"
            php artisan db:seed --class=ChangelogSeeder --force

            echo "==> Clearing caches"
            php artisan config:clear
            php artisan cache:clear
            php artisan view:clear
            php artisan route:clear
            php artisan event:clear

            echo "==> Caching for production"
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            echo "==> Restarting queue workers"
            php artisan queue:restart

            echo "==> Bringing app back online"
            php artisan up

            echo "==> Live deploy complete"

name: Deploy to Dev

on:
  push:
    branches: [dev]

jobs:
  deploy:
    name: Deploy to dev.solyx.gg
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEV_SSH_HOST }}
          username: ${{ secrets.DEV_SSH_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          port: ${{ secrets.DEV_SSH_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.DEV_APP_PATH }}

            echo "==> Pulling latest dev branch"
            git pull origin dev

            echo "==> Installing Composer dependencies"
            composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev

            echo "==> Installing npm dependencies and building assets"
            npm ci
            npm run build

            echo "==> Putting app into maintenance mode"
            php artisan down --retry=10 || true

            echo "==> Running migrations"
            php artisan migrate --force

            echo "==> Running changelog seeder"
            php artisan db:seed --class=ChangelogSeeder --force

            echo "==> Clearing caches"
            php artisan config:clear
            php artisan cache:clear
            php artisan view:clear
            php artisan route:clear
            php artisan event:clear

            echo "==> Caching for production"
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            echo "==> Restarting queue workers"
            php artisan queue:restart

            echo "==> Bringing app back online"
            php artisan up

            echo "==> Dev deploy complete"

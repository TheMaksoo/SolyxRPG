name: Changelog Agent

on:
  pull_request:
    types: [closed]
    branches: [dev]

# Label conventions:
#   Tag:        bug / fix / hotfix → fix   |  feature / feat / enhancement → feature  |  balance / rebalance → balance  |  chore / docs / refactor / misc → misc
#   Visibility: tester-changelog / tester-only  → testers + GMs only
#               gm-changelog / gm-only          → GMs only
#               (no label)                      → player (visible to everyone)

jobs:
  update-changelog:
    name: Append changelog entry
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring
          coverage: none

      - name: Generate changelog entry
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_MERGED_AT: ${{ github.event.pull_request.merged_at }}
        run: php .github/scripts/changelog-agent.php

      - name: Commit changelog seeder update
        run: |
          git config user.name "Solyx Changelog Bot"
          git config user.email "changelog-bot@solyx.gg"
          git add database/seeders/ChangelogSeeder.php
          if git diff --staged --quiet; then
            echo "No changelog changes to commit."
          else
            git commit -m "chore: changelog entry for PR #${{ github.event.pull_request.number }} [${{ github.event.pull_request.title }}]"
            git push origin dev
          fi
